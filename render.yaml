services:
  - type: web
    name: today-fortune-telling
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon  # 또는 singapore (가까운 리전)
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: OLLAMA_URL
        value: https://ooziest-unhemmed-rheba.ngrok-free.dev
      - key: PORT
        value: 10000
    healthCheckPath: /api/chat/health
