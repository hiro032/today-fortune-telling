spring:
  ai:
    ollama:
      # 프로덕션 환경: ngrok 터널을 통한 로컬 Ollama 접근
      # Render 환경 변수 OLLAMA_URL에서 ngrok URL 설정
      base-url: ${OLLAMA_URL}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.7
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

server:
  # Render가 동적으로 PORT 환경 변수 설정
  port: ${PORT:8080}

logging:
  level:
    org.springframework.ai: INFO
    com.example.springai: INFO
