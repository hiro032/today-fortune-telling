spring:
  application:
    name: spring-ai-rag-agent
  ai:
    ollama:
      # 환경 변수 OLLAMA_URL로 설정 가능
      # ngrok URL을 여기에 설정: https://your-ngrok-url.ngrok-free.app
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.7
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.ai: INFO
    com.example.springai: INFO
