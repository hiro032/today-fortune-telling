spring:
  ai:
    ollama:
      # 로컬 Ollama 서버
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text

server:
  port: 8080

logging:
  level:
    org.springframework.ai: DEBUG
    com.example.springai: DEBUG
