<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 운세</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 운세 & 사주팔자 🔮</h1>
            <p class="subtitle">당신의 운명을 밝혀드립니다</p>
        </header>

        <main>
            <!-- 서비스 선택 화면 -->
            <div class="service-selection" id="serviceSelection">
                <h2>원하시는 서비스를 선택하세요</h2>
                <div class="service-buttons">
                    <button class="service-btn" id="fortuneBtn" onclick="selectService('fortune')">
                        <div class="service-icon">🌟</div>
                        <h3>오늘의 운세</h3>
                        <p>오늘 하루의 운세를 확인하세요</p>
                    </button>
                    <button class="service-btn" id="sajuBtn" onclick="selectService('saju')">
                        <div class="service-icon">📜</div>
                        <h3>사주팔자</h3>
                        <p>평생의 운명을 사주로 풀어보세요</p>
                    </button>
                    <button class="service-btn" id="compatibilityBtn" onclick="selectService('compatibility')">
                        <div class="service-icon">💑</div>
                        <h3>궁합 보기</h3>
                        <p>두 사람의 궁합을 분석합니다</p>
                    </button>
                </div>
            </div>

            <!-- 오늘의 운세 폼 -->
            <div class="form-container" id="fortuneFormContainer" style="display: none;">
                <button class="back-btn" onclick="backToSelection()">← 뒤로 가기</button>
                <h2>오늘의 운세</h2>
                <form id="fortuneForm">
                    <div class="form-group">
                        <label for="fortuneName">이름</label>
                        <input type="text" id="fortuneName" placeholder="홍길동" required>
                    </div>

                    <div class="form-group">
                        <label>성별</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="fortuneGender" value="male" required>
                                <span>남성</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="fortuneGender" value="female" required>
                                <span>여성</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fortuneBirthDate">생년월일</label>
                        <input type="date" id="fortuneBirthDate" required>
                    </div>

                    <button type="submit" class="submit-btn">운세 보기</button>
                </form>
            </div>

            <!-- 사주팔자 폼 -->
            <div class="form-container" id="sajuFormContainer" style="display: none;">
                <button class="back-btn" onclick="backToSelection()">← 뒤로 가기</button>
                <h2>사주팔자</h2>
                <form id="sajuForm">
                    <div class="form-group">
                        <label for="sajuName">이름</label>
                        <input type="text" id="sajuName" placeholder="홍길동" required>
                    </div>

                    <div class="form-group">
                        <label>성별</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="sajuGender" value="male" required>
                                <span>남성</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="sajuGender" value="female" required>
                                <span>여성</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="sajuBirthDate">생년월일</label>
                        <input type="date" id="sajuBirthDate" required>
                    </div>

                    <div class="form-group">
                        <label for="sajuBirthTime">태어난 시간 (선택사항)</label>
                        <input type="time" id="sajuBirthTime" placeholder="HH:MM">
                        <small>시간을 모르시면 비워두셔도 됩니다</small>
                    </div>

                    <button type="submit" class="submit-btn">사주 보기</button>
                </form>
            </div>

            <!-- 결과 표시 -->
            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-header">
                    <h2 id="resultTitle"></h2>
                </div>
                <div class="result-content" id="resultContent">
                    <!-- Result will be displayed here -->
                </div>
                <button class="reset-btn" onclick="backToSelection()">처음으로</button>
            </div>

            <!-- 궁합 보기 폼 -->
            <div class="form-container" id="compatibilityFormContainer" style="display: none;">
                <button class="back-btn" onclick="backToSelection()">← 뒤로 가기</button>
                <h2>궁합 보기</h2>
                <form id="compatibilityForm">
                    <div class="person-section">
                        <h3>첫 번째 사람</h3>
                        <div class="form-group">
                            <label for="name1">이름</label>
                            <input type="text" id="name1" placeholder="홍길동" required>
                        </div>
                        <div class="form-group">
                            <label>성별</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="gender1" value="male" required>
                                    <span>남성</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="gender1" value="female" required>
                                    <span>여성</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="birthDate1">생년월일</label>
                            <input type="date" id="birthDate1" required>
                        </div>
                    </div>

                    <div class="person-section">
                        <h3>두 번째 사람</h3>
                        <div class="form-group">
                            <label for="name2">이름</label>
                            <input type="text" id="name2" placeholder="김철수" required>
                        </div>
                        <div class="form-group">
                            <label>성별</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="gender2" value="male" required>
                                    <span>남성</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="gender2" value="female" required>
                                    <span>여성</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="birthDate2">생년월일</label>
                            <input type="date" id="birthDate2" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="compatibilityType">궁합 타입</label>
                        <select id="compatibilityType" class="select-input">
                            <option value="general">전반적인 궁합</option>
                            <option value="love">연애 궁합</option>
                            <option value="marriage">결혼 궁합</option>
                            <option value="business">사업 파트너 궁합</option>
                            <option value="friendship">우정 궁합</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">궁합 분석하기</button>
                </form>
            </div>

            <!-- 로딩 (개선된 UI) -->
            <div class="loading" id="loading" style="display: none;">
                <div class="loading-animation">
                    <div class="crystal-ball">
                        <div class="crystal-inner"></div>
                        <div class="sparkle sparkle-1">✨</div>
                        <div class="sparkle sparkle-2">✨</div>
                        <div class="sparkle sparkle-3">✨</div>
                    </div>
                </div>
                <p id="loadingText" class="loading-main-text">운세를 확인하고 있습니다...</p>
                <p id="loadingTip" class="loading-tip">잠시만 기다려주세요</p>
            </div>
        </main>

        <footer>
            <p>🌟 Spring AI + Ollama로 구동됩니다 🌟</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
