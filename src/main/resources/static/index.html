<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 운세</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 오늘의 운세 🔮</h1>
            <p class="subtitle">당신의 오늘을 밝혀드립니다</p>
        </header>

        <main>
            <div class="form-container" id="formContainer">
                <form id="fortuneForm">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="홍길동"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>성별</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="male"
                                    required
                                >
                                <span>남성</span>
                            </label>
                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="female"
                                    required
                                >
                                <span>여성</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="birthDate">생년월일</label>
                        <input
                            type="date"
                            id="birthDate"
                            name="birthDate"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        운세 보기
                    </button>
                </form>
            </div>

            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-header">
                    <h2><span id="resultName"></span>님의 오늘의 운세</h2>
                </div>
                <div class="result-content" id="resultContent">
                    <!-- Fortune result will be displayed here -->
                </div>
                <button class="reset-btn" id="resetBtn">다시 보기</button>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>운세를 확인하고 있습니다...</p>
            </div>
        </main>

        <footer>
            <p>🌟 Spring AI + Ollama로 구동됩니다 🌟</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
